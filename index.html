<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Decode — explore runway archives and fashion looks.">
  <title>The Decode | Runway Archives</title>

  <!-- ONE CSS LINK: component files are imported by style.css -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Small header: original logo + reusable avatar -->
  <header class="container site-header">
    <a href="#top" aria-label="The Decode — back to top">
      <img src="images/decode-logo.png" alt="The Decode" class="site-logo">
    </a>
    <img src="images/runway-look.jpg" alt="Runway-inspired example profile avatar" class="avatar">
  </header>

  <main id="top">
    <!-- BANNER: reuses the .container and .btn-primary components -->
    <div class="banner">
      <div class="container">
        <h1>Runway archives,<br>decoded.</h1>
        <h2>Browse year by year, city by city, brand by brand, collection by collection.</h2>
        <a href="#looks" class="btn-primary">Explore runway looks ↗</a>
      </div>
    </div>

    <!-- Small content preview: the CTA leads here -->
    <section id="looks" class="container highlights">
      <h2>Popular seasons</h2>
      <p>A closer look at runway moments.</p>

      <div class="highlight-images">
        <img src="images/runway-look.jpg" alt="Model in a gold-green top and turquoise skirt on the runway">
        <img src="images/runway-atmosphere.jpg" alt="Model in white walking at a fashion show">
      </div>
    </section>
  </main>
<!-- EARLY ACCESS FORM -->
<section class="signup-section" id="join">
  <div class="container">
    <div class="signup-card">

      <h2>Get Started</h2>

      <div data-tf-live="01M5FSCF5QDV0N5MXEV2GERRX7"></div>
<script src="https://embed.typeform.com/next/embed.js"></script>

    </div>
  </div>
</section>
</body>
</html>
